<!DOCTYPE html>
<html>
<head>
    <title>VA Restaurant</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        /* Header */
        .header {
            background-image: url(images.jpg);
            backdrop-filter: blur(10px);
            text-align: center;
            padding: 30px 10px;
        }

        .header h1 {
            color: blue;
            font-size: 36px;
        }

        .header p {
            color: blue;
            font-size: 16px;
        }

        /* Menu title */
        .menu-title {
            text-align: center;
            font-size: 24px;
            margin: 20px 0;
            text-decoration: underline;
        }

        /* Menu container */
        .menu-container {
            width: 90%;
            max-width: 900px;
            margin: auto;
        }

        /* Menu item */
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 2px solid #ff66cc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .menu-left {
            display: flex;
            align-items: center;
        }

        .menu-left img {
            width: 80px;
            height: 80px;
            border-radius: 6px;
            object-fit: cover;
        }

        .menu-text {
            margin-left: 20px;
            font-size: 16px;
        }

        .price {
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>

<body>
   <style> body {
    background-color: rgb(11, 2, 61);
}</style>

    <!-- Header -->
    <div class="header">
        <h1>VA Restaurant</h1>
        <p>Enjoy our delicious meals!</p>
    </div>

    <!-- Menu -->
    <h2 class="menu-title"style="color: #f2f2f2;">Menu</h2>

    <div class="menu-container">

        <!-- Item 1 -->
        <div class="menu-item">
            <div class="menu-left">
                <img src="https://authenticroyal.com/wp-content/uploads/2024/05/How-to-Make-Chicken-Biryani-Video.jpg" alt="Veg Biryani">
                <div class="menu-text" style="color: #f2f2f2;">
                    Veg Biryani is a delicious south indian dish
                </div>
            </div>
            <div class="price"style="color: #f2f2f2;">₹180</div>
        </div>

        <!-- Item 2 -->
        <div class="menu-item">
            <div class="menu-left">
                <img src="https://www.indianhealthyrecipes.com/wp-content/uploads/2021/07/paneer-butter-masala.webp" alt="Paneer Butter Masala">
                <div class="menu-text"style="color: #f2f2f2;">
                    Paneer butter masala is a delicious side dish
                </div>
            </div>
            <div class="price"style="color: #f2f2f2;">₹180</div>
        </div>

        <!-- Item 3 -->
        <div class="menu-item">
            <div class="menu-left">
                <img src="https://shwetainthekitchen.com/wp-content/uploads/2023/06/veg-fried-rice.jpg" alt="Veg Fried Rice">
                <div class="menu-text"style="color: #f2f2f2;">
                    Veg Fried rice is a delicious chinese dish
                </div>
            </div>
            <div class="price"style="color: #f2f2f2;">₹180</div>
        </div>

        <!--Item 4-->
        <!-- Item 3 -->
        <div class="menu-item">
            <div class="menu-left">
                <img src="https://simply-delicious-food.com/wp-content/uploads/2015/12/IMG_4473-2.jpg" alt="Chicken Curry">
                <div class="menu-text"style="color: #f2f2f2;">
                    Chicken Curry is a delicious chinese dish
                </div>
            </div>
            <div class="price"style="color: #f2f2f2;">₹400</div>
        </div>

    </div>

</body>
</html>
